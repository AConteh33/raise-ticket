<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Issue Tracker</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <h1 class="text-gradient" style="margin:0 0 0.25rem;font-size:1.5rem">Sign in</h1>
      <p class="subtitle" style="margin-bottom:1.5rem">Authorized team accounts only</p>
      <div id="error" class="alert alert-error hidden"></div>
      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required />
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required />
        <button class="btn-primary" type="submit" id="submit-btn">Sign in</button>
      </form>
      <p class="subtitle" style="margin-top:1.5rem;font-size:0.75rem;text-align:center">
        First time? Run <code>npm run db:seed</code> to create an admin account.
      </p>
    </div>
  </div>
  <script src="/js/config.js?v=10"></script>
  <script src="/js/api.js?v=10"></script>
  <script src="/js/auth.js"></script>
  <script>
    Auth.onAuthChange(({ profile, ready }) => {
      if (!ready) return;
      if (profile) window.location.href = "/index.html";
    });
    Auth.initAuth();
    document.getElementById("login-form").onsubmit = async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("error");
      const btn = document.getElementById("submit-btn");
      errorEl.classList.add("hidden");
      btn.disabled = true;
      btn.textContent = "Signing in...";
      try {
        await Auth.login(
          document.getElementById("email").value,
          document.getElementById("password").value
        );
      } catch (err) {
        errorEl.textContent = Auth.friendlyAuthError(err);
        errorEl.classList.remove("hidden");
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign in";
      }
    };
  </script>
</body>
</html>
