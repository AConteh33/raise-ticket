<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Management — Issue Tracker</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="header">
    <div class="header-bar"></div>
    <div class="container header-inner">
      <div>
        <h1 class="text-gradient" style="margin:0;font-size:1.5rem">User Management</h1>
        <p class="subtitle">Create and manage team accounts by role.</p>
      </div>
      <div class="header-actions">
        <a href="/admin-form.html" class="btn-secondary">Customize Form</a>
        <a href="/index.html" class="btn-secondary">← Back to tickets</a>
        <button id="logout-btn" class="btn-secondary" type="button">Sign out</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding:2rem 0;max-width:48rem">
    <div id="access-denied" class="alert alert-error hidden">Admin access required.</div>

    <form id="create-user-form" class="card hidden" style="margin-bottom:2rem">
      <h2 class="text-gradient">Create User</h2>
      <div id="form-error" class="alert alert-error hidden"></div>
      <div id="form-success" class="alert alert-success hidden"></div>

      <label for="displayName">Display name</label>
      <input id="displayName" required />

      <label for="email">Email</label>
      <input id="email" type="email" required />

      <label for="password">Password</label>
      <input id="password" type="password" required minlength="6" />

      <label for="role">Role</label>
      <select id="role" required></select>

      <button class="btn-primary" type="submit" id="submit-btn">Create User</button>
    </form>

    <section class="card hidden" id="users-section">
      <h2 class="text-gradient">Existing Users</h2>
      <div id="users-error" class="alert alert-error hidden"></div>
      <div id="users-success" class="alert alert-success hidden"></div>
      <ul id="user-list" class="user-list"></ul>
    </section>
  </main>

  <script src="/js/constants.js"></script>
  <script src="/js/config.js?v=1.1"></script>
  <script src="/js/api.js?v=1.1"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/users.js"></script>
  <script>
    const C = window.APP_CONSTANTS;
    let currentUserUid = null;

    const roleSelect = document.getElementById("role");
    for (const role of C.USER_ROLES) {
      const opt = document.createElement("option");
      opt.value = role;
      opt.textContent = C.ROLE_LABELS[role];
      roleSelect.appendChild(opt);
    }

    function showMsg(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.classList.remove("hidden");
      setTimeout(() => el.classList.add("hidden"), 4000);
    }

    async function loadUsers() {
      const users = await Users.listUsers();
      const list = document.getElementById("user-list");
      list.innerHTML = users
        .map(
          (u) => `
            <li class="user-row">
              <div class="user-info">
                <strong>${u.displayName}</strong>
                <span class="subtitle">${u.email}</span>
                ${u.uid === currentUserUid ? '<span class="user-you-badge">You</span>' : ""}
              </div>
              <div class="user-actions">
                <select
                  class="user-role-select"
                  data-uid="${u.uid}"
                  ${u.uid === currentUserUid ? "disabled" : ""}
                >
                  ${C.USER_ROLES.map(
                    (r) =>
                      `<option value="${r}"${u.role === r ? " selected" : ""}>${C.ROLE_LABELS[r]}</option>`
                  ).join("")}
                </select>
                <button
                  class="btn-danger user-delete-btn"
                  data-uid="${u.uid}"
                  data-name="${u.displayName}"
                  ${u.uid === currentUserUid ? "disabled" : ""}
                >Delete</button>
              </div>
            </li>`
        )
        .join("");

      list.querySelectorAll(".user-role-select").forEach((sel) => {
        sel.onchange = async () => {
          const uid = sel.dataset.uid;
          const newRole = sel.value;
          try {
            await Users.updateUserRole(uid, newRole);
            showMsg("users-success", "Role updated");
            await loadUsers();
          } catch (err) {
            showMsg("users-error", err.message);
            await loadUsers();
          }
        };
      });

      list.querySelectorAll(".user-delete-btn").forEach((btn) => {
        btn.onclick = async () => {
          const uid = btn.dataset.uid;
          const name = btn.dataset.name;
          if (!confirm(`Delete ${name}? Their tickets will remain in the system.`)) return;
          try {
            await Users.deleteUser(uid);
            showMsg("users-success", "User deleted");
            await loadUsers();
          } catch (err) {
            showMsg("users-error", err.message);
          }
        };
      });
    }

    Auth.onAuthChange(async ({ user, profile, ready }) => {
      if (!ready) return;
      if (!user) {
        window.location.href = "/login.html";
        return;
      }
      if (!profile || profile.role !== "admin") {
        document.getElementById("access-denied").classList.remove("hidden");
        return;
      }
      currentUserUid = profile.uid;
      document.getElementById("create-user-form").classList.remove("hidden");
      document.getElementById("users-section").classList.remove("hidden");
      await loadUsers();
    });

    Auth.initAuth();

    document.getElementById("logout-btn").onclick = () => Auth.logout();

    document.getElementById("create-user-form").onsubmit = async (e) => {
      e.preventDefault();
      const err = document.getElementById("form-error");
      const ok = document.getElementById("form-success");
      err.classList.add("hidden");
      ok.classList.add("hidden");
      const btn = document.getElementById("submit-btn");
      btn.disabled = true;
      try {
        await Users.createUserAccount({
          displayName: document.getElementById("displayName").value,
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
          role: document.getElementById("role").value,
        });
        e.target.reset();
        showMsg("form-success", "User created successfully");
        await loadUsers();
      } catch (error) {
        showMsg("form-error", error.message);
      } finally {
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
